name: Reproduce the broad Lean reduction
on:
  push:
    branches: [automation/materialize-broad-lines]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'mmmbeer/riemann-hypothesis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Replay the deletion manifest and verify the source tree
        env:
          BASELINE: 0f8a0bca44c2fe3301ba4738dd7f399f56bedac5
          EXPECTED_SRC: e131bb0700adc847cfc3b0219065a07bddd57050
          TARGET: simplify/broad-line-reduction
        run: |
          set -euo pipefail
          git switch --detach "$BASELINE"
          dir=verification/simplification
          git checkout "$GITHUB_SHA" -- "$dir/unused-declarations.tsv.gz" "$dir/check-unused-declarations.py" "$dir/replay-unused-declarations.py"
          python3 "$dir/replay-unused-declarations.py" . "$dir/unused-declarations.tsv.gz"
          git add -u src
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:src")" = "$EXPECTED_SRC"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prune 20,292 declarations outside the five-theorem dependency graph'
          git push origin "HEAD:refs/heads/$TARGET"
