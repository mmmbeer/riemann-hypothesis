name: checks

# Fork checks build Challenge on hosted runners. The upstream repository can
# also compare the original submission against the published archive.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'leanprover-community/riemann-hypothesis'
    name: Historic original-submission provenance comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the archive from alpo.ge and compare
        run: |
          T="$RUNNER_TEMP/dl"; mkdir "$T"
          for i in $(seq -w 1 14); do curl -fsSL --retry 3 -o "$T/part$i" "https://alpo.ge/lean.tar.gz.part$i"; done
          cat "$T"/part* > "$T/lean.tar.gz"
          echo "9631b4f020199e580ba86178cb56c6e9b09f690c2369a80dc4334aa93f49c7fc  $T/lean.tar.gz" | sha256sum -c
          tar xzf "$T/lean.tar.gz" -C "$T"

          # src/ differs only by the added Challenge.lean
          d=$(diff -r "$T/lean/src" src || true); echo "$d"
          [ "$d" = "Only in src: Challenge.lean" ]
          cmp "$T/lean/lean-toolchain" lean-toolchain
          cmp "$T/lean/lake-manifest.json" lake-manifest.json

          # Only the explicit cache prefix and marked Comparator suffix are additions.
          printf '# Cache infrastructure; the original submission starts below this block.\nplatformIndependent = true\n\n' > "$T/cache-prefix"
          head -n 3 lakefile.toml | cmp - "$T/cache-prefix"
          tail -n +4 lakefile.toml > "$T/lakefile-without-cache.toml"
          n=$(wc -c < "$T/lean/lakefile.toml")
          head -c "$n" "$T/lakefile-without-cache.toml" | cmp - "$T/lean/lakefile.toml"
          tail -c +"$((n + 1))" "$T/lakefile-without-cache.toml"

  challenge:
    name: Challenge compiles against Mathlib alone
    runs-on: ubuntu-latest
    env:
      LEAN_ABORT_ON_PANIC: "1"   # as Comparator sets it for builds and exports
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4   # Mathlib's current cache server
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check row and window proof wiring against recorded interfaces
        run: python3 verification/simplification/check-row-wiring.py
      - name: Fetch Mathlib's official build cache
        run: lake exe mathlib/cache get
      - name: Build only the Challenge module
        run: lake build Challenge
      - name: Check the finite-slope alternative against Mathlib
        run: lake env lean verification/simplification/IntegratedRankLoss.lean
